<title>Bedside Brief Verifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400;1,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper:#FBFAF7; --surface:#F3F1EB; --raised:#FFFFFF;
    --ink:#16211F; --ink-soft:#4C5854; --ink-faint:#78837E;
    --teal:#0F5257; --teal-ink:#0F5257; --teal-soft:#E3EDEC;
    --amber:#8F5310; --amber-soft:#F6ECDC;
    --sage:#3F6B4E; --sage-soft:#E4EDE5;
    --rule:#DEDACF; --rule-firm:#C6C1B4;
    --serif:"Spectral",Georgia,serif;
    --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#101614; --surface:#182120; --raised:#1C2624;
      --ink:#EDEFEA; --ink-soft:#A9B3AE; --ink-faint:#7E8884;
      --teal:#6FBDB3; --teal-ink:#8FD0C7; --teal-soft:#17302F;
      --amber:#DBA05A; --amber-soft:#2C2318;
      --sage:#85BA92; --sage-soft:#1A2A1E;
      --rule:#29332F; --rule-firm:#3B4642;
    }
  }
  :root[data-theme="dark"] {
    --paper:#101614; --surface:#182120; --raised:#1C2624;
    --ink:#EDEFEA; --ink-soft:#A9B3AE; --ink-faint:#7E8884;
    --teal:#6FBDB3; --teal-ink:#8FD0C7; --teal-soft:#17302F;
    --amber:#DBA05A; --amber-soft:#2C2318;
    --sage:#85BA92; --sage-soft:#1A2A1E;
    --rule:#29332F; --rule-firm:#3B4642;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.55;
    padding-inline:16px; padding-block:0 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:64rem; margin:0 auto; }

  /* ---------- masthead + progress ---------- */
  header.top {
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--rule); padding-block:12px 10px;
    display:flex; flex-direction:column; gap:9px;
  }
  .toprow { display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .brand { font-family:var(--serif); font-weight:600; font-size:19px; letter-spacing:-0.01em; }
  .count { font-family:var(--mono); font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .count b { color:var(--ink); font-size:15px; }
  .track { height:6px; background:var(--surface); border:1px solid var(--rule); border-radius:99px; overflow:hidden; }
  .track i { display:block; height:100%; width:0; background:var(--sage); transition:width .3s ease; }
  @media (prefers-reduced-motion: reduce) { .track i { transition:none; } }

  /* ---------- filter chips ---------- */
  .chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .chip {
    flex:none; font:inherit; font-size:13.5px; font-weight:500;
    padding:7px 13px; border-radius:99px; cursor:pointer;
    background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--rule);
  }
  .chip[aria-pressed="true"] { background:var(--teal); border-color:var(--teal); color:var(--paper); }
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color:#0B1211; }
  @media (prefers-color-scheme: light) { .chip[aria-pressed="true"] { color:#FBFAF7; } }

  /* ---------- queue ---------- */
  .queue { list-style:none; margin:18px 0 0; padding:0; border-top:1px solid var(--rule); }
  .row {
    display:grid; grid-template-columns:2.2rem 1fr auto; gap:3px 12px;
    align-items:center; width:100%; text-align:left;
    padding:13px 6px; background:none; border:none; border-bottom:1px solid var(--rule);
    font:inherit; color:inherit; cursor:pointer; min-height:60px;
  }
  .row:hover, .row:focus-visible { background:var(--surface); }
  .row .n { font-family:var(--mono); font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .row .rid { font-family:var(--mono); font-size:13px; word-break:break-all; }
  .row .rt { grid-column:2; font-size:13.5px; color:var(--ink-soft); }
  .row .badges { grid-row:1 / span 2; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }

  .pill {
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:99px; white-space:nowrap; border:1px solid transparent;
  }
  .p-agree { background:var(--sage-soft); color:var(--sage); border-color:var(--sage); }
  .p-part  { background:var(--teal-soft); color:var(--teal-ink); border-color:var(--teal); }
  .p-dis   { background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
  .p-win   { background:var(--amber); color:#1A1206; font-weight:500; }
  .p-done  { background:var(--sage); color:#0B1211; font-weight:500; }
  .p-rej   { background:var(--rule-firm); color:var(--ink); }

  /* ---------- record ---------- */
  .back {
    font:inherit; font-size:14px; font-weight:500; background:none; border:none; cursor:pointer;
    color:var(--teal-ink); padding:14px 0 6px; display:inline-flex; gap:7px; align-items:center;
  }
  .rechead { display:flex; flex-direction:column; gap:7px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
  .rechead h1 { font-family:var(--serif); font-size:26px; font-weight:600; line-height:1.2; margin:0; text-wrap:balance; }
  .recid { font-family:var(--mono); font-size:13px; color:var(--teal-ink); word-break:break-all; }
  .meta { font-size:13.5px; color:var(--ink-soft); }
  .meta b { color:var(--ink); font-weight:600; }

  .flagbox {
    margin-top:16px; background:var(--amber-soft); border-left:3px solid var(--amber);
    padding:12px 14px; font-size:13.5px; display:flex; flex-direction:column; gap:6px;
  }
  .flagbox h2 { font-family:var(--sans); font-size:12px; letter-spacing:.07em; text-transform:uppercase; margin:0; color:var(--amber); }
  .flagbox ul { margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; }
  .flagbox li { line-height:1.45; }

  .cols { display:grid; grid-template-columns:1fr; gap:16px; margin-top:18px; }
  @media (min-width:780px) { .cols { grid-template-columns:1fr 1fr; gap:18px; } }

  .pkt { border:1px solid var(--rule); background:var(--raised); display:flex; flex-direction:column; }
  .pkt > header {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--rule); background:var(--surface);
  }
  .pkt h2 { font-family:var(--mono); font-size:13px; font-weight:500; margin:0; letter-spacing:.04em; }
  .pkt .body { padding:13px 14px; display:flex; flex-direction:column; gap:13px; }
  .field { display:flex; flex-direction:column; gap:2px; }
  .field dt { font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .field dd { margin:0; font-size:14.5px; }

  .est { border:1px solid var(--rule); border-left:3px solid var(--teal); background:var(--paper); padding:11px 12px; display:flex; flex-direction:column; gap:8px; }
  .est.off { opacity:.42; border-left-color:var(--rule-firm); }
  .est h3 { font-family:var(--sans); font-size:14.5px; font-weight:600; margin:0; line-height:1.35; }
  .estmeta { font-size:12.5px; color:var(--ink-soft); }
  .stats { display:flex; flex-wrap:wrap; gap:5px 8px; }
  .stat { font-family:var(--mono); font-size:12px; background:var(--surface); border:1px solid var(--rule); padding:3px 7px; font-variant-numeric:tabular-nums; }
  .stat b { color:var(--teal-ink); font-weight:500; }
  blockquote { margin:0; font-family:var(--serif); font-style:italic; font-size:14px; line-height:1.5; color:var(--ink-soft); border-left:2px solid var(--rule-firm); padding-left:10px; }
  .cite { font-size:12.5px; }
  .cite a { color:var(--teal-ink); }
  .loc { font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); }
  .estfoot { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .toggle { font:inherit; font-size:12.5px; background:none; border:1px solid var(--rule-firm); color:var(--ink-soft); padding:5px 11px; border-radius:99px; cursor:pointer; }
  .toggle[aria-pressed="false"] { background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
  .empty { font-size:14px; color:var(--ink-faint); font-style:italic; }

  /* ---------- decision bar: fixed so it is reachable without scrolling past the evidence ---------- */
  body.deciding { padding-bottom:210px; }
  .decide {
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:var(--paper); border-top:2px solid var(--ink);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; gap:8px;
    box-shadow:0 -6px 18px rgba(0,0,0,.10);
  }
  .decide .inner { max-width:64rem; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:8px; }
  .noterow { display:flex; gap:8px; align-items:stretch; }
  .noterow .notes { flex:1; min-height:42px; }
  .editcount {
    font-family:var(--mono); font-size:11.5px; color:var(--amber);
    background:var(--amber-soft); border:1px solid var(--amber);
    padding:0 10px; display:flex; align-items:center; white-space:nowrap;
  }

  /* ---------- per-estimate correction ---------- */
  .fixbox { border-top:1px dashed var(--rule-firm); padding-top:9px; display:flex; flex-direction:column; gap:8px; }
  .fixgrid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  @media (min-width:520px) { .fixgrid { grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .fixgrid label { display:flex; flex-direction:column; gap:3px; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); }
  .fixgrid input, .fixnote {
    font:inherit; font-size:15px; font-family:var(--mono); width:100%;
    padding:8px 9px; background:var(--raised); color:var(--ink);
    border:1px solid var(--rule-firm); border-radius:0;
  }
  .fixnote { font-family:var(--sans); min-height:40px; }
  .fixgrid input.changed { border-color:var(--amber); background:var(--amber-soft); color:var(--amber); }
  .est.edited { border-left-color:var(--amber); }
  .est.edited h3::after { content:" · corrected"; color:var(--amber); font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:.06em; }
  .notes {
    font:inherit; font-size:14.5px; width:100%; padding:9px 11px; min-height:44px; resize:vertical;
    background:var(--raised); color:var(--ink); border:1px solid var(--rule-firm); border-radius:0;
  }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (min-width:620px) { .btns { grid-template-columns:repeat(4, 1fr); } }
  .btn {
    font:inherit; font-size:15px; font-weight:600; padding:14px 10px; cursor:pointer;
    border:1px solid var(--rule-firm); background:var(--surface); color:var(--ink); min-height:52px;
  }
  .btn.pa, .btn.pb { background:var(--sage); border-color:var(--sage); color:#0B1211; }
  .btn.rej { background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:active { transform:translateY(1px); }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform:none; } }
  .decided { font-size:13.5px; color:var(--sage); font-weight:600; }
  .decided.rejected { color:var(--amber); }

  .note { font-size:13px; color:var(--ink-faint); }
  .banner { background:var(--amber-soft); border-left:3px solid var(--amber); padding:12px 14px; font-size:14px; margin-top:18px; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  .hidden { display:none !important; }
</style>

<div class="wrap">
  <header class="top">
    <div class="toprow">
      <div class="brand">Bedside Brief Verifier</div>
      <div class="count" id="count">connecting…</div>
    </div>
    <div class="track"><i id="bar"></i></div>
    <div class="chips" id="chips" role="group" aria-label="Filter the queue"></div>
  </header>

  <main id="main">
    <p class="note" id="boot" style="padding-top:24px">Loading the queue…</p>
  </main>
</div>

<script>
(function () {
  "use strict";
  var TARGET = 60;
  var state = { db:null, queue:[], decisions:{}, filter:"todo", view:"queue", rec:null, excl:{}, edits:{}, open:{}, busy:false, booted:false };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function num(v) {
    if (v == null) return "";
    var n = Number(v);
    return Number.isFinite(n) ? (Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(2)).replace(/\.?0+$/, "") : "";
  }
  function safeUrl(u) { return /^https:\/\//i.test(u || "") ? u : ""; }

  /* ---------------- boot ---------------- */
  // window.claude is injected by the viewer and may not exist when this script first runs, so poll
  // for it instead of calling through it immediately: a synchronous throw here would leave the page
  // on its loading line for ever, with no catch attached yet.
  function waitForClaude(ms) {
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function poll() {
        try {
          if (window.claude && typeof window.claude.use === "function") return resolve(window.claude);
        } catch (e) { /* ignore and keep waiting */ }
        if (Date.now() - t0 > ms) return resolve(null);
        setTimeout(poll, 120);
      })();
    });
  }

  function fail(headline, detail) {
    $("count").textContent = "not connected";
    $("main").innerHTML =
      '<div class="banner"><b>' + esc(headline) + "</b>" +
      (detail ? '<div class="note" style="margin-top:6px">' + esc(detail) + "</div>" : "") +
      '<div style="margin-top:12px"><button class="btn" type="button" id="retry">Try again</button></div>' +
      '<div class="note" style="margin-top:10px">You can always verify on a computer with ' +
      '<span class="loc">./start_verify.sh</span>.</div></div>';
  }

  window.addEventListener("error", function (e) {
    if (state.booted) return;
    fail("The page hit an error while starting.", e && e.message ? e.message : "");
  });

  /* ---------------- data ---------------- */
  function load() {
    $("main").innerHTML = '<p class="note" style="padding-top:24px">Loading the queue…</p>';
    waitForClaude(15000).then(function (c) {
      if (!c) { fail("Could not reach the Claude runtime in this view.", "window.claude never appeared."); return; }
      return c.use("db").then(function (db) {
        if (!db) { fail("This view cannot open the store.", "Storage is not granted or not served here."); return; }
        state.db = db;
        return db.doc("meta/index").get().then(function (snap) {
          if (!snap || !snap.exists) { fail("The queue has not been seeded yet.", "meta/index is missing."); return; }
          var d = snap.data() || {};
          state.queue = Array.isArray(d.queue) ? d.queue : [];
          if (!state.queue.length) { fail("The queue loaded but is empty.", ""); return; }
          // An empty decisions collection is normal on the first visit; never let it block the queue.
          return db.collection("decisions").get().then(function (qs) {
            (qs && qs.docs ? qs.docs : []).forEach(function (sn) {
              var v = sn.data(); if (v && v.id) state.decisions[v.id] = v;
            });
          }).catch(function () { /* start with no decisions */ }).then(function () {
            state.booted = true;
            render();
          });
        });
      });
    }).catch(function (e) {
      fail("Could not load the queue.", e && (e.code || e.message) ? String(e.code || e.message) : "");
    });
  }

  function offline(msg) { fail(msg, ""); }

  function saveDecision(rec) {
    if (!state.db) return Promise.reject(new Error("no store"));
    return state.db.doc("decisions/" + rec.id).set(rec);
  }

  /* ---------------- progress ---------------- */
  function refreshProgress() {
    var promoted = 0, done = 0;
    Object.keys(state.decisions).forEach(function (k) {
      var a = state.decisions[k] && state.decisions[k].action;
      if (a === "promote") promoted++;
      if (a === "promote" || a === "reject") done++;
    });
    $("count").innerHTML = "<b>" + promoted + "</b> / " + TARGET + " verified · " + done + " of " + state.queue.length + " decided";
    $("bar").style.width = Math.min(100, (promoted / TARGET) * 100) + "%";
  }

  /* ---------------- queue ---------------- */
  var FILTERS = [
    { k:"todo",  label:"Undecided" },
    { k:"win",   label:"Quick wins" },
    { k:"dis",   label:"Disagree" },
    { k:"rce",   label:"RCE-backed" },
    { k:"done",  label:"Decided" },
    { k:"all",   label:"All" }
  ];

  function renderChips() {
    $("chips").innerHTML = FILTERS.map(function (f) {
      return '<button class="chip" type="button" data-f="' + f.k + '" aria-pressed="' +
        (state.filter === f.k) + '">' + esc(f.label) + "</button>";
    }).join("");
  }

  function visible() {
    return state.queue.filter(function (q) {
      var d = state.decisions[q.id], decided = d && (d.action === "promote" || d.action === "reject");
      switch (state.filter) {
        case "todo": return !decided;
        case "win":  return !!q.quickwin;
        case "dis":  return q.status === "disagree";
        case "rce":  return !!q.rce;
        case "done": return !!decided;
        default:     return true;
      }
    });
  }

  function statusPill(q) {
    if (q.status === "agree")    return '<span class="pill p-agree">agree</span>';
    if (q.status === "disagree") return '<span class="pill p-dis">disagree</span>';
    return '<span class="pill p-part">partial</span>';
  }

  function renderQueue() {
    var list = visible();
    var body = list.length
      ? '<ul class="queue">' + list.map(function (q) {
          var d = state.decisions[q.id];
          var mark = "";
          if (d && d.action === "promote") mark = '<span class="pill p-done">verified ' + esc(d.base || "") + "</span>";
          else if (d && d.action === "reject") mark = '<span class="pill p-rej">rejected</span>';
          else if (q.quickwin) mark = '<span class="pill p-win">quick win ' + esc(q.quickwin) + "</span>";
          return '<li><button class="row" type="button" data-id="' + esc(q.id) + '">' +
            '<span class="n">' + q.order + "</span>" +
            '<span class="rid">' + esc(q.id) + "</span>" +
            '<span class="badges">' + mark + statusPill(q) +
              (q.flags ? '<span class="pill p-dis">' + q.flags + " flag" + (q.flags === 1 ? "" : "s") + "</span>" : "") +
            "</span>" +
            '<span class="rt">' + esc(q.title) + "</span>" +
          "</button></li>";
        }).join("") + "</ul>"
      : '<p class="note" style="padding-top:26px">Nothing here. Try another filter.</p>';
    $("main").innerHTML = body;
  }

  /* ---------------- record ---------------- */
  function statLine(e) {
    var bits = [];
    function add(label, s) {
      if (!s) return;
      var ci = (s.ci_low != null && s.ci_high != null) ? " (" + num(s.ci_low) + "–" + num(s.ci_high) + ")" : "";
      bits.push('<span class="stat">' + label + " <b>" + num(s.value) + "</b>" + esc(ci) + "</span>");
    }
    add("Sens", e.sensitivity); add("Spec", e.specificity);
    add("LR+", e.lr_positive);  add("LR−", e.lr_negative);
    if (e.prevalence != null) bits.push('<span class="stat">Prev <b>' + num(e.prevalence) + "</b></span>");
    if (e.computed) bits.push('<span class="stat">computed</span>');
    return bits.length ? '<div class="stats">' + bits.join("") + "</div>" : '<p class="empty">No numeric estimate.</p>';
  }

  var STATS = [
    ["sensitivity", "Sens"], ["specificity", "Spec"],
    ["lr_positive", "LR+"], ["lr_negative", "LR\u2212"]
  ];

  // A correction panel: the stored value is prefilled, the owner overwrites what the source actually says.
  function fixHtml(key, e) {
    var ed = state.edits[key] || {};
    return '<div class="fixbox">' +
      '<div class="fixgrid">' + STATS.map(function (p) {
        var stored = e[p[0]] && e[p[0]].value != null ? e[p[0]].value : "";
        var val = ed[p[0]] != null ? ed[p[0]] : stored;
        var changed = ed[p[0]] != null && String(ed[p[0]]) !== String(stored);
        return "<label>" + p[1] +
          '<input type="text" inputmode="decimal" autocomplete="off"' +
          ' id="fix-' + esc(key.replace(":", "-")) + "-" + p[0] + '"' +
          ' data-fixfield="' + esc(key) + "|" + p[0] + '"' +
          ' class="' + (changed ? "changed" : "") + '"' +
          ' value="' + esc(val) + '" placeholder="—"></label>';
      }).join("") + "</div>" +
      '<textarea class="fixnote" data-fixfield="' + esc(key) + '|note" ' +
        'id="fixnote-' + esc(key.replace(":", "-")) + '" ' +
        'placeholder="What is wrong with this estimate, and what the source actually says">' +
        esc(ed.note || "") + "</textarea>" +
    "</div>";
  }

  function estHtml(side, e, i) {
    var key = side + ":" + i, on = !state.excl[key];
    var ed = !!state.open[key];
    var edited = !!state.edits[key];
    var link = safeUrl(e.link);
    return '<div class="est' + (on ? "" : " off") + (edited ? " edited" : "") + '" data-est="' + key + '">' +
      "<h3>" + esc(e.target_condition || "(no target condition)") + "</h3>" +
      '<div class="estmeta">' + esc(e.population || "population not stated") +
        (e.setting ? " · " + esc(e.setting) : "") +
        (e.reference_standard ? " · vs " + esc(e.reference_standard) : "") + "</div>" +
      statLine(e) +
      (e.quote ? "<blockquote>" + esc(e.quote) + "</blockquote>" : "") +
      '<div class="estfoot">' +
        '<div class="cite">' +
          (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(e.citation || "source") + "</a>"
                : esc(e.citation || "no citation")) +
          (e.location ? ' <span class="loc">' + esc(e.location) + "</span>" : "") +
        "</div>" +
        '<div style="display:flex;gap:6px">' +
          '<button class="toggle" type="button" data-fix="' + key + '">' + (ed ? "Editing" : "Correct") + "</button>" +
          '<button class="toggle" type="button" data-toggle="' + key + '" aria-pressed="' + on + '">' +
            (on ? "Included" : "Excluded") + "</button>" +
        "</div>" +
      "</div>" +
      (ed ? fixHtml(key, e) : "") +
    "</div>";
  }

  function pktHtml(side, p) {
    if (!p) return "";
    var ests = (p.estimates || []);
    return '<section class="pkt">' +
      "<header><h2>extractor-" + side + "</h2>" +
        '<span class="pill ' + (p.evidence_status === "quantified" ? "p-agree" :
            p.evidence_status === "not_quantified" ? "p-dis" : "p-part") + '">' +
        esc((p.evidence_status || "").replace(/_/g, " ")) + "</span></header>" +
      '<div class="body">' +
        (p.how ? '<div class="field"><dt>Technique</dt><dd>' + esc(p.how) + "</dd></div>" : "") +
        (p.contraindications ? '<div class="field"><dt>Do not use when</dt><dd>' + esc(p.contraindications) + "</dd></div>" : "") +
        (p.skill_assumption ? '<div class="field"><dt>Skill assumed</dt><dd>' + esc(p.skill_assumption) + "</dd></div>" : "") +
        (p.positive_finding ? '<div class="field"><dt>Positive</dt><dd>' + esc(p.positive_finding) + "</dd></div>" : "") +
        (p.negative_finding ? '<div class="field"><dt>Negative</dt><dd>' + esc(p.negative_finding) + "</dd></div>" : "") +
        (p.changes_what ? '<div class="field"><dt>Changes what</dt><dd>' + esc(p.changes_what) + "</dd></div>" : "") +
        (p.pitfalls ? '<div class="field"><dt>Pitfalls</dt><dd>' + esc(p.pitfalls) + "</dd></div>" : "") +
        (ests.length ? ests.map(function (e, i) { return estHtml(side, e, i); }).join("")
                     : '<p class="empty">No estimates in this packet.</p>') +
        (p.notes ? '<div class="field"><dt>Extraction notes</dt><dd class="estmeta">' + esc(p.notes) + "</dd></div>" : "") +
      "</div></section>";
  }

  // Red-team files also contain roll-up lines that name a dozen ids at once; those are noise on a
  // single record. Keep the lines that are about THIS record, and strip markdown so they read plainly.
  function cleanFlags(r) {
    var own = (r.flags || []).slice();
    var ids = /`[a-z]+_[a-z0-9_]+`/g;
    (r.redteam || []).forEach(function (line) {
      var names = line.match(ids) || [];
      if (names.length > 2) return;                    // a summary list, not a finding
      if (/^\s*\d+\.\s/.test(line)) return;            // numbered roll-up
      var t = line.replace(/\*\*/g, "").replace(/`/g, "").replace(/^[-*|\s]+/, "").trim();
      if (t.length > 12) own.push(t);
    });
    return own;
  }

  function renderRecord() {
    var r = state.rec, d = state.decisions[r.id];
    var flags = cleanFlags(r);
    var html =
      '<button class="back" type="button" id="back">← Queue</button>' +
      '<div class="rechead">' +
        '<div class="recid">' + esc(r.id) + "</div>" +
        "<h1>" + esc(r.title) + "</h1>" +
        '<div class="meta"><b>' + esc(r.type) + "</b> · " + esc((r.presentations || []).join(", ")) + "</div>" +
        (r.anchor_source ? '<div class="meta">Anchor: ' + esc(r.anchor_source) + "</div>" : "") +
      "</div>" +
      (flags.length ? '<div class="flagbox"><h2>Flags to check</h2><ul>' +
          flags.slice(0, 14).map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul></div>" : "") +
      (r.quickwin ? '<div class="banner">Quick win: packet <b>' + esc(r.quickwin) +
          "</b> carries a located number the other packet missed.</div>" : "") +
      '<div class="cols">' + pktHtml("A", r.A) + pktHtml("B", r.B) + "</div>" +
      '<div class="decide"><div class="inner">' +
        (d ? '<div class="decided' + (d.action === "reject" ? " rejected" : "") + '">Recorded: ' +
             esc(d.action) + (d.base ? " from packet " + esc(d.base) : "") + '. Deciding again replaces it.</div>' : "") +
        '<div class="noterow">' +
          '<textarea class="notes" id="notes" placeholder="Verification note — what you checked, what you changed"></textarea>' +
          '<span class="editcount" id="editcount" hidden></span>' +
        "</div>" +
        '<div class="btns">' +
          '<button class="btn pa" type="button" data-act="promote" data-base="A">Promote A</button>' +
          '<button class="btn pb" type="button" data-act="promote" data-base="B">Promote B</button>' +
          '<button class="btn rej" type="button" data-act="reject">Reject</button>' +
          '<button class="btn" type="button" data-act="skip">Skip</button>' +
        "</div>" +
      "</div></div>";
    $("main").innerHTML = html;
    document.body.classList.add("deciding");
    if (d && d.notes) $("notes").value = d.notes;
    refreshEditCount();
  }

  function refreshEditCount() {
    var el = $("editcount");
    if (!el) return;
    var n = Object.keys(state.edits).length;
    el.hidden = n === 0;
    el.textContent = n ? n + " correction" + (n === 1 ? "" : "s") : "";
  }

  function render() {
    renderChips();
    refreshProgress();
    document.body.classList.remove("deciding");
    if (state.view === "record" && state.rec) renderRecord(); else renderQueue();
    window.scrollTo(0, 0);
  }

  function openRecord(id) {
    if (!state.db) return;
    $("main").innerHTML = '<p class="note" style="padding-top:24px">Loading ' + esc(id) + "…</p>";
    state.db.doc("records/" + id).get().then(function (s) {
      if (!s.exists) { $("main").innerHTML = '<div class="banner">That record is not in the store.</div>'; return; }
      state.rec = s.data();
      state.excl = {};
      state.edits = {};
      state.open = {};
      state.view = "record";
      render();
    }).catch(function () {
      $("main").innerHTML = '<div class="banner">Could not open that record. Go back and try again.</div>';
    });
  }

  function decide(action, base) {
    if (state.busy || !state.rec) return;
    var r = state.rec;
    var notesEl = $("notes");
    var notes = notesEl ? notesEl.value.trim() : "";
    if (action === "reject" && !notes && !Object.keys(state.edits).length) {
      notesEl.focus();
      notesEl.placeholder = "A reason is required to reject.";
      return;
    }
    if (action === "skip") { state.view = "queue"; state.rec = null; render(); return; }

    var exclude = Object.keys(state.excl).filter(function (k) {
      return state.excl[k] && k.indexOf(base + ":") === 0;
    }).map(function (k) { return Number(k.split(":")[1]); });

    var edits = {};
    Object.keys(state.edits).forEach(function (k) {
      if (action !== "promote" || k.indexOf(base + ":") === 0) edits[k] = state.edits[k];
    });

    var rec = {
      id: r.id, action: action, base: action === "promote" ? base : null,
      exclude: exclude, edits: edits, notes: notes, at: new Date().toISOString()
    };
    state.busy = true;
    document.querySelectorAll(".btn").forEach(function (b) { b.disabled = true; });
    saveDecision(rec).then(function () {
      state.decisions[r.id] = rec;
      state.busy = false;
      var list = visible();
      var next = list.find(function (q) { return !state.decisions[q.id]; });
      state.view = "queue"; state.rec = null;
      render();
      if (next && state.filter === "todo") openRecord(next.id);
    }).catch(function (e) {
      state.busy = false;
      document.querySelectorAll(".btn").forEach(function (b) { b.disabled = false; });
      var bar = document.querySelector(".decide");
      if (bar) {
        var w = document.createElement("p");
        w.className = "note";
        w.style.color = "var(--amber)";
        w.textContent = "Not saved" + (e && e.code ? " (" + e.code + ")" : "") + ". Try again.";
        bar.appendChild(w);
      }
    });
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.classList.contains("chip")) { state.filter = t.dataset.f; state.view = "queue"; state.rec = null; render(); return; }
    if (t.classList.contains("row")) { openRecord(t.dataset.id); return; }
    if (t.id === "back") { state.view = "queue"; state.rec = null; render(); return; }
    if (t.dataset.fix) {
      var fk = t.dataset.fix;
      state.open[fk] = !state.open[fk];
      renderRecord();
      var focusEl = document.getElementById("fix-" + fk.replace(":", "-") + "-sensitivity");
      if (state.open[fk] && focusEl) focusEl.focus();
      return;
    }
    if (t.dataset.toggle) {
      var k = t.dataset.toggle;
      state.excl[k] = !state.excl[k];
      t.setAttribute("aria-pressed", String(!state.excl[k]));
      t.textContent = state.excl[k] ? "Excluded" : "Included";
      var card = document.querySelector('[data-est="' + k + '"]');
      if (card) card.classList.toggle("off", !!state.excl[k]);
      return;
    }
    if (t.id === "retry") { load(); return; }
    if (t.dataset.act) { decide(t.dataset.act, t.dataset.base); return; }
  });

  // Corrections are captured as they are typed, so nothing is lost if the page re-renders.
  document.addEventListener("input", function (ev) {
    var f = ev.target && ev.target.dataset ? ev.target.dataset.fixfield : null;
    if (!f) return;
    var parts = f.split("|"), key = parts[0], field = parts[1];
    var rec = state.edits[key] || {};
    var raw = String(ev.target.value == null ? "" : ev.target.value).trim();

    if (field === "note") {
      if (raw) rec.note = raw; else delete rec.note;
    } else if (raw === "") {
      delete rec[field];
    } else {
      var n = Number(raw);
      if (!Number.isFinite(n)) return;          // let them keep typing "0." etc.
      rec[field] = n;
      ev.target.classList.add("changed");
    }

    if (Object.keys(rec).length) state.edits[key] = rec; else delete state.edits[key];
    var card = document.querySelector('[data-est="' + key + '"]');
    if (card) card.classList.toggle("edited", !!state.edits[key]);
    refreshEditCount();
  });

  renderChips();
  load();
})();
</script>
